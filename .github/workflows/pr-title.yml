name: PR title

# Validates that pull-request titles follow Conventional Commits, so that a
# squash-merge (which uses the PR title as the commit subject) keeps main's
# history in the shape release-please needs. Runs ONLY on pull requests — it
# does not gate direct pushes to main, which the maintainer and parallel
# agent sessions still use. The PR title is read by the action via the API
# under GITHUB_TOKEN; it is never interpolated into a shell command.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: release-please

# On every push to main, release-please maintains a "chore: release X.Y.Z"
# PR that accumulates conventional-commit changes since the last release.
# Merging that PR bumps the four version manifests (package.json,
# apps/web/package.json, apps/desktop/tauri.conf.json, apps/desktop/Cargo.toml),
# regenerates CHANGELOG.md, tags vX.Y.Z, and creates the GitHub Release.
#
# apps/desktop/Cargo.lock is bumped alongside Cargo.toml (an `extra-files`
# entry in release-please-config.json). It carries the crate's own version
# too, and cargo rewrites the file the first time anyone builds after a
# release -- without that entry the lockfile sat a version behind and every
# local cargo run dirtied the tree. Its jsonpath has to reach through
# `.value` (`$.package[?(@.name.value=="app")].version`): release-please
# parses TOML with a tagged parser that wraps every scalar as
# {start,end,value}, so the obvious `@.name=="app"` matches nothing and is
# skipped with a warning rather than an error. The write is a byte-range
# splice into the original text, so cargo's own formatting survives.
#
# The tag is pushed with RELEASE_PLEASE_TOKEN (a fine-grained PAT), NOT the
# default GITHUB_TOKEN. This is deliberate: a tag pushed by GITHUB_TOKEN does
# not trigger other workflows, so release.yml (the signed DMG build) would
# never fire. The PAT-pushed tag does trigger it.
#
# Required repo secret (also stored in Bitwarden, item "Portuni release-please
# PAT"): RELEASE_PLEASE_TOKEN — fine-grained PAT scoped to this repo with
# Contents: read/write and Pull requests: read/write.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

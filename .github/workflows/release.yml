name: Release

# Tag-triggered: pushing a `v*` tag (e.g. `v0.1.1`) kicks off a build on
# an Apple Silicon macOS runner and attaches the DMG and updater artefacts
# to the GitHub Release release-please created for that tag. That release is
# a pre-release and is not the repository's "Latest" -- the final step below
# fails the job if either is untrue. Nothing reaches installed apps or the
# website's download link until `scripts/release-rollout.sh promote <tag>`
# moves BOTH flags; clearing the pre-release flag alone leaves the "Latest"
# pin where it was and ships nothing. See docs/release-process.md.
#
# Builds are Developer ID signed and notarized. The certificate is
# imported into a build keychain as an explicit step BEFORE tauri-action:
# scripts/build-sidecar.mjs codesigns the libsql .node bindings during
# beforeBuildCommand, which runs earlier than Tauri's own certificate
# import. Tauri then signs the bundle and submits to notarytool + staples
# automatically when the APPLE_* env vars below are present.
# Required repo secrets (stored in Bitwarden, item "Portuni Apple signing"):
#   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password chosen at .p12 export
#   APPLE_SIGNING_IDENTITY     "Developer ID Application: <name> (<team id>)"
#   APPLE_ID                   Apple ID email of the developer account
#   APPLE_PASSWORD             app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID              10-char team ID (developer.apple.com → Membership)
# Updater signing (Bitwarden item "Portuni updater signing"; public key in
# tauri.conf.json plugins.updater.pubkey):
#   TAURI_SIGNING_PRIVATE_KEY          minisign private key (file content)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password
# If any Apple secret is missing the build still succeeds — Tauri skips
# signing/notarization and ships an unsigned DMG (Gatekeeper dialog). The
# updater secrets are not optional: without them tauri-action fails to
# produce Portuni.app.tar.gz/.sig, since --config tauri.release.conf.json
# turns createUpdaterArtifacts on unconditionally.
#
# Bundle list is `app,dmg` with `--config tauri.release.conf.json`
# (createUpdaterArtifacts: true): `--bundles dmg` alone builds no updater
# tarball ("no updater-enabled targets were built", verified locally,
# tauri-cli 2.11.4). tauri-action's default `uploadUpdaterJson: true` makes
# it generate and attach latest.json to the release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only — the user base has no Intel Macs and
          # GitHub retired macos-13 in 2025-12. If Intel ever comes
          # back, macos-15-intel is the last x86_64 image (until
          # 2027-08).
          - runner: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - run: npm ci --prefix apps/web

      # The identity must exist in the keychain before beforeBuildCommand
      # runs (build-sidecar.mjs codesigns the .node bindings there).
      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Portuni ${{ github.ref_name }}"
          # tauri-action@v1 attaches to an existing release for the tag only
          # when releaseDraft matches that release's status. release-please
          # creates the release first as a NON-draft pre-release, so this
          # must be false -- with true, v1 ignores it ("Found release ... but
          # it's NOT a draft!") and creates a second, draft release that the
          # verify step below never sees (0.13.1). `prerelease` only applies
          # to the fallback release created when none exists for the tag.
          releaseDraft: false
          prerelease: true
          # v1 uploads latest.json by default (uploadUpdaterJson: true); the
          # v0-era `includeUpdaterJson` input no longer exists.
          args: --target ${{ matrix.target }} --bundles app,dmg --config tauri.release.conf.json

      # Content smoke test of the shipped artifact: fails the release when a
      # runtime dependency (guard script, native bindings) is missing from
      # the bundle -- the class of bug regular CI can never see because it
      # only ever runs from repo dist/. Verifies the DMG, not the .app,
      # since the DMG is what users download.
      - name: Verify bundle content
        run: |
          shopt -s nullglob
          dmgs=(apps/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "expected exactly one DMG, found ${#dmgs[@]}: ${dmgs[*]}" >&2
            exit 1
          fi
          scripts/verify-app-bundle.sh "${dmgs[0]}"

      # Stable-name copy of the same DMG, so portuni.com can link straight at
      # the file (.../releases/latest/download/Portuni-macos-aarch64.dmg)
      # instead of at the releases page. The versioned DMG stays the canonical
      # artefact; this is an alias uploaded alongside it.
      - name: Upload stable-name DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          dmgs=(apps/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          cp "${dmgs[0]}" "$RUNNER_TEMP/Portuni-macos-aarch64.dmg"
          gh release upload "${{ github.ref_name }}" \
            "$RUNNER_TEMP/Portuni-macos-aarch64.dmg" \
            --repo "${{ github.repository }}" --clobber

      # Updater artefacts: --config tauri.release.conf.json turns on
      # createUpdaterArtifacts, which produces Portuni.app.tar.gz + .sig next
      # to the .app in bundle/macos (the DMG build no longer deletes the
      # intermediate .app once `app` is also in --bundles). tauri-action
      # (uploadUpdaterJson, on by default) generates and attaches latest.json
      # to the release; fetch that release asset back down to check its content,
      # since tauri-action does not expose it as a job output.
      - name: Verify updater artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          bundle_dir="apps/desktop/target/${{ matrix.target }}/release/bundle/macos"
          tarballs=("$bundle_dir"/*.app.tar.gz)
          sigs=("$bundle_dir"/*.app.tar.gz.sig)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "expected exactly one Portuni.app.tar.gz, found ${#tarballs[@]}: ${tarballs[*]}" >&2
            exit 1
          fi
          if [[ ${#sigs[@]} -ne 1 ]]; then
            echo "expected exactly one Portuni.app.tar.gz.sig, found ${#sigs[@]}: ${sigs[*]}" >&2
            exit 1
          fi
          echo "ok: $(basename "${tarballs[0]}")"
          echo "ok: $(basename "${sigs[0]}")"

          tag="${{ github.ref_name }}"
          expected_version="${tag#v}"
          work="$RUNNER_TEMP/latest.json"
          rm -f "$work"
          gh release download "$tag" --repo "${{ github.repository }}" \
            --pattern latest.json --output "$work"

          actual_version="$(jq -r '.version' "$work")"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "latest.json version '$actual_version' != tag version '$expected_version'" >&2
            exit 1
          fi
          if ! jq -e '.platforms["darwin-aarch64"]' "$work" > /dev/null; then
            echo "latest.json is missing a darwin-aarch64 platform entry" >&2
            exit 1
          fi
          echo "ok: latest.json version $actual_version, darwin-aarch64 present"

      # The rollout gate, checked rather than assumed. A release carries two
      # independent flags and only the second one ships anything: `prerelease`
      # decides eligibility, `make_latest` is the pin `releases/latest`
      # resolves to -- and both the updater endpoint and the website's
      # download link go through that. A build must leave BOTH closed, so
      # that reaching users stays a deliberate act
      # (scripts/release-rollout.sh promote <tag>) and can never be a side
      # effect of tagging.
      - name: Verify the rollout gate is closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"

          prerelease="$(gh api "repos/$repo/releases/tags/$tag" --jq '.prerelease')"
          if [[ "$prerelease" != "true" ]]; then
            echo "$tag is not a pre-release: this build is eligible to ship to every installed app without anyone promoting it" >&2
            exit 1
          fi

          # 404s while the repository has no full release at all; that is a
          # closed gate too, not an error.
          latest="$(gh api "repos/$repo/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ "$latest" == "$tag" ]]; then
            echo "$tag is already the repository's latest release: installed apps and the website are being served an unpromoted build" >&2
            exit 1
          fi

          echo "ok: $tag is a pre-release, latest is still ${latest:-<none>}"

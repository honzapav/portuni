name: Release

# Tag-triggered: pushing a `v*` tag (e.g. `v0.1.1`) kicks off a matrix
# build on Apple Silicon and Intel macOS runners, then attaches both
# DMGs to a draft GitHub Release on that tag. Edit the release body
# and click "Publish" once both jobs go green.
#
# Builds are Developer ID signed and notarized. tauri-action imports the
# certificate into a temporary keychain and Tauri submits to notarytool
# and staples automatically when the APPLE_* env vars below are present.
# Required repo secrets (stored in Bitwarden, item "Portuni Apple signing"):
#   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password chosen at .p12 export
#   APPLE_SIGNING_IDENTITY     "Developer ID Application: <name> (<team id>)"
#   APPLE_ID                   Apple ID email of the developer account
#   APPLE_PASSWORD             app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID              10-char team ID (developer.apple.com → Membership)
# If any secret is missing the build still succeeds — Tauri skips
# signing/notarization and ships an unsigned DMG (Gatekeeper dialog).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - run: npm ci --prefix apps/web

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Portuni ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg

# Dependabot: jen bezpečnostní opravy, jeden PR za každou část repa.
# Pravidelné aktualizace verzí jsou vypnuté (open-pull-requests-limit: 0).
# Jednotný standard pro všechna repa sledovaná službou asana-github-sync.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/sites/marketing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/sites/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/.sandcastle"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      bezpecnost:
        applies-to: security-updates
        patterns:
          - "*"

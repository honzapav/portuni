[package]
name = "app"
version = "0.17.0" # x-release-please-version
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# No `devtools` feature: debug builds (cargo tauri dev) get the inspector
# automatically; shipping it in release would let any local process attach
# to the webview inspector of the installed app.
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
# A second launch (`open -n`, a Dock re-click) relays to the already-running
# instance instead of starting a fully separate process -- without this, the
# second process's own spawn_sidecar_ws/reap_orphan_sidecar kills the first
# instance's sidecars out from under it (#230, desktop multi-window phase 2).
tauri-plugin-single-instance = "2"
# Per-window (by label) size/position persistence -- each ws:<id> window
# remembers its own geometry across launches (#225, desktop multi-window
# phase 2).
tauri-plugin-window-state = "2"
rand = "0.10"
# v3 has no default features; pick platform-native stores explicitly. macOS
# is the only smoke-tested target for this PR but cross-platform features
# stay enabled so cargo builds on Linux/Windows without code changes.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Used by the api_request command to proxy webview HTTP calls into the
# sidecar. Version pinned to match what tauri already pulls in transitively
# (Cargo.lock) so we don't bring a second copy along.
reqwest = { version = "0.13", features = ["json", "form"] }
# URL-safe base64 for the PKCE code challenge in auth.rs (Google OAuth).
base64 = "0.23"
# Read one entry (preview.html) out of a .showtime deck bundle for the
# portuni-html preview protocol. Deflate only: that is what Showtime packs.
# Already in Cargo.lock transitively (4.x), so no second copy.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Open external URLs/paths in the OS default handler. The JS shell plugin's
# `open` proved to be a silent no-op inside the macOS webview, so external
# links (Google Drive folder, actor links) are opened natively via the
# open_external command instead. Already present transitively via
# tauri-plugin-shell (Cargo.lock pins 5.3.4); promoted to a direct dep.
open = "5"
# Parse + scheme-validate URLs before handing them to the OS opener, so
# open_external can't be coaxed into launching file:// or arbitrary custom
# URL handlers. Already present transitively (Cargo.lock pins 2.5.x).
url = "2"
# SHA-256 for PKCE S256 challenge computation (Google OAuth).
# Already present transitively (Cargo.lock pins 0.10.x); promoted to a
# direct dep so the auth module can use it without relying on transitive
# availability.
sha2 = "0.11"
# Comment- and format-preserving TOML editor. Used by the Mistral Vibe MCP
# installer: Vibe's ~/.vibe/config.toml carries `mcp_servers = []` as a
# value array (not [[mcp_servers]] blocks), so naive text appending would
# produce a duplicate-key TOML error. toml_edit lets us push our server
# into the existing array idempotently without clobbering the rest of the
# (large, default) config. Already present transitively (Cargo.lock).
toml_edit = "0.25"
# Percent-decoding for the portuni-html custom URI scheme handler.
# Already present transitively (Cargo.lock pins 2.3.2); promoted to a
# direct dep so the protocol handler can use it explicitly.
percent-encoding = "2"
# WebSocket client for sessions_connect (#341): the Rust host holds the one
# live channel connection per window (security rule 3 -- the webview never
# opens it directly) and bridges frames to session-event window events.
# Default features only (connect/handshake/stream, no TLS backend) -- every
# connection target is a loopback sidecar (ws://127.0.0.1:<port>), never
# wss://, so no TLS implementation is needed. Runs on the same tokio runtime
# tauri already pulls in transitively (Cargo.lock pins 1.52.x).
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Already present transitively via tauri's own async runtime (Cargo.lock
# pins 1.52.x); promoted to a direct dep for sessions_ws.rs's own use of
# tokio::select!/tokio::sync::mpsc/tokio::time::sleep.
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
# Scratch .showtime bundles for the preview protocol tests. Already in
# Cargo.lock transitively.
tempfile = "3"
